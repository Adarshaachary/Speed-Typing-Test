<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

    <link rel="stylesheet" href="style.css">

    <title>Speed Typing Test</title>
</head>

<body>

    <div class="container py-5">

        <div id="speedTypingTest" class="typing-card">

            <div class="heading-section">

                <div class="logo-box">
                    <i class="fa-solid fa-bolt"></i>
                </div>

                <div>
                    <h1>Speed <span>Typing Test</span></h1>
                    <p class="para">Test your typing speed and accuracy in real time.</p>
                </div>

            </div>

            <div class="timer-card">

                <div class="timer-icon">
                    <i class="fa-regular fa-clock"></i>
                </div>

                <div>
                    <h2><span id="timer">0</span> <small>seconds</small></h2>
                </div>

            </div>

            <div class="quote-card">

                <div class="quote-title">
                    <i class="fa-solid fa-quote-left"></i>
                    <span>Typing Challenge</span>
                </div>

                <p id="quoteDisplay"></p>

                <textarea id="quoteInput" class="quoteInput" placeholder="Start typing here..."></textarea>

            </div>

            <p id="result" class="result"></p>

            <div class="button-group">

                <button id="startBtn" class="btn btn-success action-btn">
                    <i class="fa-solid fa-play"></i>
                    Start
                </button>

                <button id="submitBtn" class="btn submitBtn action-btn">
                    <i class="fa-solid fa-paper-plane"></i>
                    Submit
                </button>

                <button id="resetBtn" class="btn resetBtn action-btn">
                    <i class="fa-solid fa-rotate-left"></i>
                    Reset
                </button>

                <button id="historyBtn" class="btn btn-info action-btn">
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    Previous Attempts
                </button>

            </div>

            <div id="spinnerContainer" class="d-none text-center mt-4">

                <div id="spinner" class="spinner-border text-primary" role="status">
                    <span class="sr-only">Loading...</span>
                </div>

                <p class="mt-3">Fetching a random quote...</p>

            </div>

            <div id="historySection" class="history-card mt-5" style="display: none;">

                <h3>
                    <i class="fa-solid fa-clock-rotate-left"></i>
                    Previous Attempts
                </h3>

                <div id="historyList"></div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
